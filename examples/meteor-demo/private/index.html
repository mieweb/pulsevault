<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Huddle — PulseVault Meteor demo</title>
    <style>
      :root {
        --bg: #0a0e16;
        --surface: #11161f;
        --surface-2: #161c28;
        --border: #232a38;
        --text: #e7eaf0;
        --text-2: #9aa4b8;
        --text-3: #626d82;
        --accent: #ff383c;
        --ok: #34d399;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      * { box-sizing: border-box; min-width: 0; }
      body { max-width: 64rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; line-height: 1.5; }
      h1 { font-size: 1.05rem; font-weight: 700; margin: 0; }
      h2 { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); margin: 0 0 0.75rem; }
      p { margin: 0; }
      a { color: var(--text-2); }
      code { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 0.05rem 0.3rem; font-size: 0.85em; }

      .top { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
      .brand { display: flex; align-items: center; gap: 0.6rem; }
      .mark { width: 1.9rem; height: 1.9rem; border-radius: 7px; background: linear-gradient(135deg, var(--accent), #b91c1c); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.85rem; }
      .sub { font-size: 0.75rem; color: var(--text-3); }
      .me { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: var(--text-2); }

      .cols { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1.25rem; }
      @media (max-width: 760px) { .cols { grid-template-columns: minmax(0, 1fr); } }
      .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 1rem 1.1rem; }
      .stack > * + * { margin-top: 0.9rem; }

      .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.45rem 0.85rem; font-size: 0.8rem; font-weight: 600; border-radius: 7px; cursor: pointer; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-family: inherit; }
      .btn:hover { border-color: var(--text-3); }
      .btn-pulse { background: var(--accent); border-color: transparent; color: #fff; }
      .btn-pulse:hover { background: #e3262b; }
      .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.72rem; }
      .btn-link { background: none; border: none; color: var(--text-3); padding: 0; font-size: 0.75rem; cursor: pointer; text-decoration: underline; font-family: inherit; }
      input { font: inherit; font-size: 0.85rem; padding: 0.45rem 0.6rem; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
      .row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

      .post { border-top: 1px solid var(--border); padding-top: 0.9rem; }
      .post:first-child { border-top: none; padding-top: 0; }
      .byline { font-size: 0.75rem; color: var(--text-3); margin-bottom: 0.35rem; }
      .byline b { color: var(--text-2); }
      .empty { font-size: 0.8rem; color: var(--text-3); }

      /* The video card: the poster with a play button, the player mounted on tap. Width is
         fixed, height follows the poster, so vertical clips keep their shape. */
      .card { position: relative; width: 100%; max-width: 20rem; border-radius: 10px; overflow: hidden; background: #000; }
      .card button.play { all: unset; display: block; width: 100%; cursor: pointer; }
      .card button.play:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
      .card img { display: block; width: 100%; }
      .card .fallback { display: block; width: 100%; aspect-ratio: 9 / 16; max-height: 22rem; background: #111; }
      .card .glyph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
      .card .glyph span { width: 3rem; height: 3rem; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; padding-left: 0.2rem; }
      .card video { display: block; width: 100%; max-height: 32rem; background: #000; }
      .card .state { position: absolute; left: 0.5rem; bottom: 0.5rem; font-size: 0.65rem; background: rgba(0,0,0,0.6); color: #fff; padding: 0.15rem 0.45rem; border-radius: 999px; }
      .title { font-size: 0.85rem; margin-top: 0.4rem; }

      .ticket { border-top: 1px solid var(--border); padding: 0.75rem 0; }
      .ticket:first-of-type { border-top: none; padding-top: 0; }
      .ticket-head { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
      .ticket-id { font-family: ui-monospace, SFMono-Regular, monospace; font-size: 0.72rem; color: var(--text-3); }
      .attachments { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.6rem; }

      /* The pairing popup */
      .scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 10; }
      .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem; width: 100%; max-width: 22rem; text-align: center; }
      .modal h3 { margin: 0 0 0.25rem; font-size: 0.95rem; }
      .modal .where { font-size: 0.78rem; color: var(--text-2); margin-bottom: 0.9rem; }
      .qr { display: block; margin: 0 auto; border-radius: 8px; background: #fff; padding: 8px; width: 240px; max-width: 100%; }
      .status { margin-top: 0.9rem; font-size: 0.82rem; min-height: 1.5rem; }
      .status.ok { color: var(--ok); }
      .status.warn { color: #fbbf24; }
      .bar { height: 0.35rem; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-top: 0.4rem; }
      .bar i { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }
      .modal .actions { display: flex; gap: 0.5rem; justify-content: center; margin-top: 0.9rem; flex-wrap: wrap; }
      .hint { font-size: 0.72rem; color: var(--text-3); margin-top: 0.75rem; }

      details.how { margin-top: 1.5rem; font-size: 0.8rem; color: var(--text-2); }
      details.how summary { cursor: pointer; font-weight: 600; color: var(--text-2); }
      details.how ol { padding-left: 1.2rem; margin: 0.5rem 0 0; }
      details.how li { margin: 0.25rem 0; }
      footer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.72rem; color: var(--text-3); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Real React, no build step: pinned ESM builds from a CDN, with `htm` for JSX-like
         templating. Keeps the example a single `meteor run`. -->
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@19.1.0",
          "react-dom/client": "https://esm.sh/react-dom@19.1.0/client",
          "htm/react": "https://esm.sh/htm@3.1.1/react?deps=react@19.1.0"
        }
      }
    </script>
    <script type="module">
      import { useState, useEffect, useCallback, useRef } from "react";
      import { createRoot } from "react-dom/client";
      import { html } from "htm/react";

      const api = async (method, path, body) => {
        const res = await fetch(`/api${path}`, {
          method,
          headers: body ? { "content-type": "application/json" } : {},
          body: body ? JSON.stringify(body) : undefined,
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `${method} ${path} failed (${res.status})`);
        return data;
      };

      // ----------------------------------------------------------------- //
      // Who's using it: a name, kept in a cookie. No passwords in a demo.  //
      // ----------------------------------------------------------------- //
      function NamePrompt({ onDone }) {
        const [name, setName] = useState("");
        const submit = async (e) => {
          e.preventDefault();
          if (!name.trim()) return;
          await api("POST", "/me", { name });
          onDone(name.trim());
        };
        return html`<div class="scrim"><form class="modal" onSubmit=${submit}>
          <h3>Who are you?</h3>
          <p class="where">A name is all this demo needs. It travels inside each upload's token, so the server knows whose video landed without a table.</p>
          <div class="row" style=${{ justifyContent: "center" }}>
            <input autoFocus placeholder="Your name" value=${name} onInput=${(e) => setName(e.target.value)} />
            <button class="btn btn-pulse" type="submit">Continue</button>
          </div>
        </form></div>`;
      }

      // ----------------------------------------------------------------- //
      // The pairing popup: QR + status, polled from the server's status    //
      // proxy (PulseVault's getStatus behind an owner check).              //
      // ----------------------------------------------------------------- //
      function PulsePopup({ destination, onClose, onLanded }) {
        const [link, setLink] = useState(null);
        const [error, setError] = useState(null);
        const [status, setStatus] = useState({ state: "unknown" });
        const landed = useRef(false);

        useEffect(() => {
          api("POST", "/reserve", { destination }).then(setLink, (e) => setError(e.message));
        }, []);

        useEffect(() => {
          if (!link) return;
          let stop = false;
          const tick = async () => {
            if (stop || document.hidden) return;
            try {
              const s = await api("GET", `/uploads/${link.artifactId}/status`);
              if (stop) return;
              setStatus(s);
              if (s.outcome && !landed.current) {
                landed.current = true;
                onLanded();
              }
            } catch (e) {
              if (!stop) setError(e.message);
            }
          };
          tick();
          const id = setInterval(tick, 2000);
          return () => { stop = true; clearInterval(id); };
        }, [link]);

        const pct = status.state === "uploading" && status.size ? Math.round((100 * (status.bytesReceived ?? 0)) / status.size) : null;
        const line = error
          ? ["warn", error]
          : status.outcome?.state === "done"
            ? ["ok", `${status.outcome.note} ✓`]
            : status.outcome?.state === "kept"
              ? ["warn", `Kept in storage: ${status.outcome.reason}`]
              : status.state === "ready"
                ? ["", "Uploaded. Delivering…"]
                : status.state === "processing"
                  ? ["", "Uploaded. Making it web-playable…"]
                  : status.state === "uploading"
                    ? ["", `Uploading${pct !== null ? ` ${pct}%` : "…"}`]
                    : ["", "Waiting for Pulse…"];

        return html`<div class="scrim" onClick=${(e) => { if (e.target === e.currentTarget) onClose(); }}>
          <div class="modal">
            <h3>Record a Pulse</h3>
            <p class="where">It will go to <b>${link?.destination ?? "…"}</b></p>
            ${link ? html`<img class="qr" src=${link.qr} alt="Scan with Pulse" />` : html`<div class="qr" style=${{ height: "240px" }}></div>`}
            <div class=${`status ${line[0]}`}>${line[1]}</div>
            ${pct !== null && html`<div class="bar"><i style=${{ width: `${pct}%` }}></i></div>`}
            <div class="actions">
              ${link && html`<a class="btn btn-pulse" href=${link.link}>Open in Pulse</a>`}
              <button class="btn" onClick=${onClose}>${status.outcome ? "Done" : "Cancel"}</button>
            </div>
            <p class="hint">Scan on a phone with Pulse installed, or open the link on this device. The link works for ${Math.round((link?.expiresInSeconds ?? 1800) / 60)} minutes.</p>
          </div>
        </div>`;
      }

      // ----------------------------------------------------------------- //
      // A video card: poster by the video's id, player mounted on tap.     //
      // ----------------------------------------------------------------- //
      let playing = null; // starting one video pauses any other
      function VideoCard({ pulse, title }) {
        const [open, setOpen] = useState(false);
        const [noPoster, setNoPoster] = useState(false);
        const ref = useRef(null);
        useEffect(() => {
          if (!open || !ref.current) return;
          if (playing && playing !== ref.current) playing.pause();
          playing = ref.current;
          ref.current.play().catch(() => {});
        }, [open]);
        return html`<div>
          <div class="card">
            ${open
              ? html`<video ref=${ref} controls playsInline src=${pulse.src} poster=${noPoster ? undefined : pulse.poster}>
                  ${pulse.captions && html`<track kind="subtitles" srclang="en" label="Captions" src=${pulse.captions} default />`}
                </video>`
              : html`<button class="play" aria-label=${`Play ${title}`} onClick=${() => setOpen(true)}>
                  ${noPoster
                    ? html`<span class="fallback"></span>`
                    : html`<img src=${pulse.poster} alt="" onError=${() => setNoPoster(true)} />`}
                  <span class="glyph"><span>▶</span></span>
                  ${!pulse.ready && html`<span class="state">still uploading</span>`}
                </button>`}
          </div>
          <p class="title">${title}</p>
        </div>`;
      }

      // ----------------------------------------------------------------- //
      // The app                                                            //
      // ----------------------------------------------------------------- //
      function App() {
        const [me, setMe] = useState(undefined);
        const [feed, setFeed] = useState({ posts: [], tickets: [] });
        const [popup, setPopup] = useState(null); // a destination
        const [newTicket, setNewTicket] = useState("");

        const refresh = useCallback(() => api("GET", "/feed").then(setFeed).catch(() => {}), []);
        useEffect(() => { api("GET", "/me").then((r) => setMe(r.name)); }, []);
        useEffect(() => { if (me) refresh(); }, [me, refresh]);
        // A video that is still converting shows "still uploading" until the next refresh.
        useEffect(() => {
          if (!me) return;
          const id = setInterval(() => { if (!document.hidden) refresh(); }, 10000);
          return () => clearInterval(id);
        }, [me, refresh]);

        const addTicket = async (e) => {
          e.preventDefault();
          if (!newTicket.trim()) return;
          await api("POST", "/tickets", { title: newTicket });
          setNewTicket("");
          refresh();
        };
        const signOut = () => { document.cookie = "pv_user=; Path=/; Max-Age=0"; setMe(null); };

        if (me === undefined) return null;
        return html`
          <div class="top">
            <div class="brand">
              <div class="mark">P</div>
              <div><h1>Huddle</h1><div class="sub">PulseVault Meteor demo — the reference host integration</div></div>
            </div>
            ${me && html`<div class="me">You are <b>${me}</b> <button class="btn-link" onClick=${signOut}>change</button></div>`}
          </div>
          ${!me && html`<${NamePrompt} onDone=${setMe} />`}
          ${popup && html`<${PulsePopup} destination=${popup} onClose=${() => { setPopup(null); refresh(); }} onLanded=${refresh} />`}

          <div class="cols">
            <section class="panel stack">
              <div class="row" style=${{ justifyContent: "space-between" }}>
                <h2 style=${{ margin: 0 }}>Team feed</h2>
                <button class="btn btn-pulse" onClick=${() => setPopup({ kind: "feed" })}>● Post a Pulse</button>
              </div>
              ${feed.posts.length === 0 && html`<p class="empty">Nothing yet. Post a Pulse: the video lands here by itself when the upload finishes.</p>`}
              ${feed.posts.map((p) => html`<div class="post" key=${p.id}>
                <div class="byline"><b>${p.author}</b> · ${new Date(p.createdAt).toLocaleString()}</div>
                <${VideoCard} pulse=${p.pulse} title=${p.text} />
              </div>`)}
            </section>

            <section class="panel">
              <h2>Tickets</h2>
              ${feed.tickets.map((t) => html`<div class="ticket" key=${t.id}>
                <div class="ticket-head">
                  <div><span class="ticket-id">${t.id}</span> ${t.title}</div>
                  <button class="btn btn-sm" onClick=${() => setPopup({ kind: "ticket", id: t.id })}>● Pulse</button>
                </div>
                ${t.attachments.length > 0 && html`<div class="attachments">
                  ${t.attachments.map((a) => html`<${VideoCard} key=${a.videoId} pulse=${a.pulse} title=${`${a.name} — ${a.by}`} />`)}
                </div>`}
              </div>`)}
              <form class="row" style=${{ marginTop: "0.9rem" }} onSubmit=${addTicket}>
                <input placeholder="New ticket title" value=${newTicket} onInput=${(e) => setNewTicket(e.target.value)} />
                <button class="btn btn-sm" type="submit">Add</button>
              </form>
            </section>
          </div>

          <details class="how">
            <summary>How this works</summary>
            <ol>
              <li><b>Post a Pulse</b> asks <code>POST /api/reserve</code>. The server checks the destination and mints a capability token whose <code>context</code> is <code>{ userId, destination }</code>. Nothing is written.</li>
              <li>Pulse uploads the captions, beat manifest and thumbnail, then the video. PulseVault holds every create to that shape and stores the token's context with each file.</li>
              <li>PulseVault makes the video web-playable in the background, then fires <code>onUploadComplete</code> with the context. The server posts or attaches it, and records the outcome. If that throws or the server restarts, PulseVault fires it again.</li>
              <li>This popup polls <code>GET /api/uploads/:id/status</code>: PulseVault's status behind an owner check that is a comparison on the context — no table.</li>
              <li>Each card asks <code>GET /pulsevault/artifacts/:id/poster</code> for its frame and plays <code>GET /pulsevault/artifacts/:id</code>, with the pulse's captions as a track.</li>
            </ol>
          </details>
          <footer>No table of uploads, no shape check, no stale-upload cleanup, no SSE route and no content-type fix-up live in this app. See <code>server/main.js</code>.</footer>`;
      }

      createRoot(document.getElementById("root")).render(html`<${App} />`);
    </script>
  </body>
</html>
