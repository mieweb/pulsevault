# PR/push CI: build + full suite on every supported Node line (engines >=22 —
# Meteor consumers bundle Node 22 LTS; 24 is the active LTS the Pulse repo
# uses). ffmpeg is installed so the web-ready remux/transcode tests run for
# real instead of skipping. The publish workflow re-runs tests at release
# time; this catches problems at PR time instead.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: these jobs only read the repo — never write statuses,
# packages, or contents with the GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install ffmpeg (web-ready remux/transcode tests)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Audit production dependencies
        run: npm audit --omit=dev
